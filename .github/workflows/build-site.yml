name: Build site after content changes

on:
  push:
    branches: [main]
    paths:
      - build.py
      - requirements.txt
      - src/**
      - .github/workflows/build-site.yml

permissions:
  contents: write

concurrency:
  group: build-site-main
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Save generated site
        run: |
          if git diff --quiet -- dist; then
            exit 0
          fi
          git config user.name "FKBAD site builder"
          git config user.email "site-builder@users.noreply.github.com"
          git add dist
          git commit -m "Build site content"
          git push
