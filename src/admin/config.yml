- name: settings
  label: Налаштування сайту
  files:
  - name: homepage
    label: Головна сторінка
    file: src/content/settings/home.json
    format: json
    editor:
      preview: true
    fields:
    - name: headline_lines
      label: Рядки головного заголовка
      widget: list
      field:
        name: line
        label: Рядок
        widget: string
    - name: college_name
      label: Повна назва коледжу
      widget: text
    - name: background
      label: Фонове фото
      widget: image
    - name: buttons
      label: Основні кнопки
      widget: list
      collapsed: true
      summary: '{{label}}'
      fields:
      - name: label
        label: Напис на кнопці
        widget: string
      - name: url
        label: Посилання
        widget: string
    - name: quick_links
      label: Швидкі посилання
      widget: list
      collapsed: true
      summary: '{{title}}'
      fields:
      - name: title
        label: Назва
        widget: string
      - name: subtitle
        label: Підпис
        widget: string
        required: false
      - name: url
        label: Посилання
        widget: string
      - name: icon
        label: Іконка
        widget: select
        options:
        - label: Календар
          value: calendar
        - label: Навчання
          value: cap
        - label: Документ
          value: file
        - label: Книга
          value: book
    - name: news_count
      label: Кількість останніх новин
      widget: number
      value_type: int
      min: 1
      max: 10
      default: 5
  - name: general
    label: Контакти та підписи
    file: src/content/settings/site.json
    format: json
    fields:
    - label: Основний телефон
      name: phone_primary
      widget: string
    - label: Додатковий телефон 1
      name: phone_secondary
      widget: string
      required: false
    - label: Додатковий телефон 2
      name: phone_third
      widget: string
      required: false
    - label: Електронна пошта
      name: email
      widget: string
    - label: Поштова адреса
      name: address
      widget: text
    - label: Facebook
      name: facebook
      widget: string
      required: false
    - label: Telegram
      name: telegram
      widget: string
      required: false
    - label: Instagram
      name: instagram
      widget: string
      required: false
    - label: Великий підпис унизу
      name: footer_signature
      widget: string
    - label: Нижній підпис
      name: footer_slogan
      widget: string
local_backend: true
